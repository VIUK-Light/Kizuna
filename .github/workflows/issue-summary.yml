name: Issue Summarizer

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  summarize:
    if: |
      github.event_name == 'issues' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        (startsWith(github.event.comment.body, '/summary') ||
         startsWith(github.event.comment.body, '/sum'))
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create Issue Summarizer GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ISSUE_SUMMARIZER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_SUMMARIZER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write

      - name: Run OpenCode Issue Summarizer
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          mentions: "/summary,/sum"
          share: false
          prompt: |
            Summarize this GitHub issue and its discussion in Japanese.

            Include:
            - 問題の概要
            - 現在分かっていること
            - 原因候補
            - 提案されている解決策
            - 未解決事項
            - 次に取るべき行動

            Preserve important technical details, but keep the summary concise and structured.
            Do not modify files, create commits, create branches, or open pull requests.
