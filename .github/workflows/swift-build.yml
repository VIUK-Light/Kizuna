name: Swift Build Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build KizunaAI
        run: |
          xcodebuild build \
            -project "KizunaAI.xcodeproj" \
            -scheme "KizunaAI" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/swift-build-derived" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run persona response sanitizer regression tests
        run: |
          xcrun swiftc \
            "KizunaAI/AI/PersonaResponseSanitizer.swift" \
            "scripts/test_persona_response_sanitizer.swift" \
            -o "$RUNNER_TEMP/persona-response-sanitizer-tests"
          "$RUNNER_TEMP/persona-response-sanitizer-tests"

  gemma-script-tests:
    name: Gemma Script Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Gemma script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
