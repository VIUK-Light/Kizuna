name: Swift Build Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xcodegen-drift:
    name: XcodeGen Drift
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.3
        run: |
          git clone --depth 1 --branch "$XCODEGEN_VERSION" \
            https://github.com/yonaskolb/XcodeGen.git \
            "$RUNNER_TEMP/XcodeGen"
          swift build \
            --package-path "$RUNNER_TEMP/XcodeGen" \
            --configuration release \
            --product xcodegen
          xcodegen_bin_dir="$(swift build \
            --show-bin-path \
            --package-path "$RUNNER_TEMP/XcodeGen" \
            --configuration release)"
          echo "$xcodegen_bin_dir" >> "$GITHUB_PATH"
          test "$(xcodegen --version)" = "Version: $XCODEGEN_VERSION"

      - name: Regenerate project and verify no drift
        run: |
          xcodegen generate --spec project.yml --project-root .
          git diff --exit-code -- project.yml KizunaAI.xcodeproj KizunaAI/Info.plist

  macos-unit-tests:
    name: macOS Unit Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run KizunaAITests
        run: |
          xcodebuild test \
            -project "KizunaAI.xcodeproj" \
            -scheme "KizunaAI" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/kizuna-macos-tests" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  ios-simulator-compile:
    name: iOS Simulator Compile
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile KizunaAI for iOS Simulator
        run: |
          xcodebuild build \
            -project "KizunaAI.xcodeproj" \
            -scheme "KizunaAI" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/kizuna-ios-simulator" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  ios-device-compile:
    name: iOS Device Compile
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile KizunaAI for iOS device SDK
        run: |
          xcodebuild build \
            -project "KizunaAI.xcodeproj" \
            -scheme "KizunaAI" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/kizuna-ios-device" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  build:
    name: Swift Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run model artifact validator tests
        run: |
          xcrun swiftc \
            KizunaAI/AI/LocalAssistantModelArtifactValidator.swift \
            scripts/test_model_artifact_validator.swift \
            -o "$RUNNER_TEMP/model-artifact-validator-tests"
          "$RUNNER_TEMP/model-artifact-validator-tests"

      - name: Run model replacement tests
        run: |
          xcrun swiftc \
            KizunaAI/AI/LocalAssistantModelReplacement.swift \
            scripts/test_model_replacement.swift \
            -o "$RUNNER_TEMP/model-replacement-tests"
          "$RUNNER_TEMP/model-replacement-tests"

      - name: Build KizunaAI
        run: |
          xcodebuild build \
            -project "KizunaAI.xcodeproj" \
            -scheme "KizunaAI" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/swift-build-derived" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run persona response sanitizer regression tests
        run: |
          xcrun swiftc \
            "KizunaAI/AI/PersonaResponseSanitizer.swift" \
            "scripts/test_persona_response_sanitizer.swift" \
            -o "$RUNNER_TEMP/persona-response-sanitizer-tests"
          "$RUNNER_TEMP/persona-response-sanitizer-tests"

      - name: Run LiteRT-LM execution-gate regression tests
        shell: bash
        run: |
          # GitHub's macos-15 image can lag the Swift toolchain used by the
          # Xcode project. Use the complete target-equivalent concurrency
          # settings whenever the compiler supports them; the test driver is
          # explicitly @MainActor for older runners below.
          swift_settings=(-swift-version 5)
          swiftc_help="$(xcrun swiftc -help 2>&1)"
          if [[ "$swiftc_help" == *"-default-isolation"* ]]; then
            # Do not silently fall back if a compiler claims this setting but
            # rejects the complete target-equivalent configuration.
            xcrun swiftc \
              -swift-version 5 \
              -default-isolation MainActor \
              -enable-upcoming-feature ApproachableConcurrency \
              -typecheck \
              KizunaAI/AI/LiteRTLMExecutionGate.swift \
              scripts/test_litertlm_execution_gate.swift
            swift_settings+=(
              -default-isolation MainActor
              -enable-upcoming-feature ApproachableConcurrency
            )
          fi
          xcrun swiftc "${swift_settings[@]}" \
            KizunaAI/AI/LiteRTLMExecutionGate.swift \
            scripts/test_litertlm_execution_gate.swift \
            -o "$RUNNER_TEMP/litertlm-execution-gate-tests"
          "$RUNNER_TEMP/litertlm-execution-gate-tests"

  gemma-script-tests:
    name: Gemma Script Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Gemma script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
