name: Convert README screenshots to PNG

on:
  push:
    branches:
      - docs/replace-jpg-screenshots-with-png-20260807

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/replace-jpg-screenshots-with-png-20260807
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Replace JPEG screenshots with PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          names = [
              "story-library",
              "character-chat",
              "story-history",
              "character-profile",
          ]
          directory = Path("docs/screenshots")

          for name in names:
              source = directory / f"{name}.jpg"
              target = directory / f"{name}.png"
              with Image.open(source) as image:
                  image.load()
                  image.save(target, format="PNG", optimize=True, compress_level=9)
              source.unlink()

          for readme_path in (Path("README.md"), Path("README.en.md")):
              text = readme_path.read_text(encoding="utf-8")
              for name in names:
                  text = text.replace(f"docs/screenshots/{name}.jpg", f"docs/screenshots/{name}.png")
              readme_path.write_text(text, encoding="utf-8")

          Path(".github/workflows/convert-readme-screenshots-to-png.yml").unlink()
          PY

      - name: Commit PNG screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace README screenshots with PNG [skip ci]"
          git push
