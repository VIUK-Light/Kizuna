name: KizunaAI

options:
  bundleIdPrefix: com.viuk
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.1"

packages:
  LiteRTLM:
    path: ThirdParty/LiteRT-LM

targets:
  KizunaAI:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: KizunaAI
        excludes:
          - AI/LocalRuntime/**
          - AI/AICoachView.swift
          - AI/AIStudioWorkspaceView.swift
          - AI/AIVoiceChatView.swift
          - AI/GemmaWebReaderPanelView.swift
          - AI/AIStudioResearchViews.swift
          - AI/AIStudioResearchModels.swift
          - AI/AgentVisualMode.swift
          - AI/AIAssistantToolExecutor.swift
          - AI/AIChatPersistence.swift
          - AI/AICoachService.swift
          - AI/AIConversationOrchestrator.swift
          - AI/AIConversationSearchStore.swift
          - AI/AILocalModelGateway.swift
          - AI/AIPyodideSandbox.swift
          - AI/AIPythonSandbox.swift
          - AI/AIRemoteModelGateway.swift
          - AI/AIResearchOrchestrator.swift
          - AI/AISMLAnalysisEngine.swift
          - AI/AISafetyCoordinator.swift
          - AI/AISearchPlanner.swift
          - AI/AIVoiceChatService.swift
          - AI/AIVoiceChatSettings.swift
          - AI/ChatFileAttachment.swift
          - AI/ChatImageStore.swift
          - AI/GeminiSupportService.swift
          - AI/LocalSubagentRuntimePool.swift
          - AI/LocalSupportModelManager.swift
          - AI/LocalSupportModelProfile.swift
          - AI/NetworkStatusMonitor.swift
          - AI/OllamaWebSearchService.swift
          - AI/PromptInjectionDefense.swift
          - AI/TextRazorClassifier.swift
          - AI/UltraLightSafetySML.swift
          - AI/WebBrowsingAgent.swift
          - AI/ModelDirectiveParser.swift
          - "**/.DS_Store"
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Licenses
        buildPhase: resources
      # XcodeGenで再生成しても、Storyの初期パックをiOS/macOS両方へ同梱する。
      # Seed処理はBundle.mainからこのファイルを読むため、明示しないと
      # 生成後のmacOSアプリだけ一覧が空になる。
      - path: KizunaAI/AI/CharacterLibrary/SeedData/SeedStoryPacks.json
        buildPhase: resources
    dependencies:
      - package: LiteRTLM
        destinationFilters:
          - iOS
    info:
      path: KizunaAI/Info.plist
      properties:
        CFBundleDisplayName: VIUK 絆
        CFBundleName: KizunaAI
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 端末内のAIランタイムと安全に通信するために使用します。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        SDKROOT: auto
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.viuk.KizunaAI
        PRODUCT_NAME: KizunaAI
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 34CN68272C
        "ARCHS[sdk=macosx*]": arm64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        "ENABLE_APP_SANDBOX[sdk=macosx*]": NO
        "IPHONEOS_DEPLOYMENT_TARGET": "26.0"
        "MACOSX_DEPLOYMENT_TARGET": "26.0"
        "HEADER_SEARCH_PATHS[sdk=macosx*]":
          - $(inherited)
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/include
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/ggml/include
        "HEADER_SEARCH_PATHS[sdk=iphone*]":
          - $(inherited)
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/ios-headers/include
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/ios-headers/ggml/include
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/include
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/ggml/include
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]":
          - $(inherited)
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/lib/macos-arm64
        "OTHER_LDFLAGS[sdk=macosx*]":
          - $(inherited)
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -lggml-metal
          - -lggml-blas
          - -framework
          - Metal
          - -framework
          - Accelerate
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/lib/ios-arm64
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(PROJECT_DIR)/ThirdParty/llama.cpp/lib/ios-simulator-arm64
        "OTHER_LDFLAGS[sdk=iphone*]":
          - $(inherited)
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -framework
          - Accelerate
        "SWIFT_OBJC_BRIDGING_HEADER[sdk=macosx*]": KizunaAI/AI/LocalRuntimeEmbedded/LocalAssistantEmbeddedRuntime-Bridging-Header.h
        "SWIFT_OBJC_BRIDGING_HEADER[sdk=iphone*]": KizunaAI/AI/LocalRuntimeEmbedded/LocalAssistantEmbeddedRuntime-Bridging-Header.h
        # LiteRT-LM v0.14.0 is enabled on iPhone.  The app starts the native
        # runtime on CPU and performs its short readiness check automatically.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]": $(inherited) VIUK_ENABLE_LITERTLM_NATIVE USE_LITERTLM
    postBuildScripts:
      - name: Bundle Local AI Runtime
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(PROJECT_DIR)/KizunaAI/AI/LocalRuntime/llama-cli
          - $(PROJECT_DIR)/KizunaAI/AI/LocalRuntime/llama-server
          - $(PROJECT_DIR)/KizunaAI/AI/LocalRuntime/llama-cli.source-revision
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/llama-cli
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/llama-server
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/llama-cli.source-revision
        script: |
          set -euo pipefail
          if [[ "${PLATFORM_NAME:-}" != "macosx" ]]; then
            exit 0
          fi

          SRC_RUNTIME="${PROJECT_DIR}/KizunaAI/AI/LocalRuntime"
          APP_BUNDLE="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          APP_RESOURCES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$APP_RESOURCES"

          for FILE in llama-cli llama-server llama-cli.source-revision; do
            cp -fX "$SRC_RUNTIME/$FILE" "$APP_RESOURCES/$FILE"
          done
          chmod +x "$APP_RESOURCES/llama-cli" "$APP_RESOURCES/llama-server"
          xattr -cr "$APP_BUNDLE" 2>/dev/null || true

          if [[ "${CODE_SIGNING_ALLOWED:-NO}" == "YES" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            for FILE in llama-cli llama-server; do
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$APP_RESOURCES/$FILE"
            done
          fi

schemes:
  KizunaAI:
    build:
      targets:
        KizunaAI: all
    run:
      config: Debug
    archive:
      config: Release
